<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalendarz AK ELEKTRO</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Montserrat',sans-serif;
background:#f4f6f9;
color:#222;
}

header{
background:white;
text-align:center;
padding:20px;
}

header img{
max-width:260px;
}

.hero{
background:linear-gradient(135deg,#003366,#001a33);
color:white;
text-align:center;
padding:60px 20px;
}

.hero h1{
font-size:36px;
margin-bottom:10px;
}

.hero p{
font-size:18px;
margin-bottom:20px;
}

.btn{
display:inline-block;
padding:15px 30px;
margin:10px;
font-size:18px;
border-radius:30px;
text-decoration:none;
font-weight:600;
border:none;
cursor:pointer;
}

.btn-primary{
background:#e00000;
color:white;
}

.btn-primary:hover{
opacity:0.9;
}

.container{
max-width:1000px;
margin:40px auto;
padding:20px;
}

.card{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin:15px 0;
border-radius:6px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

.kalendarz{
display:none;
text-align:center;
}

.kalendarz img{
width:100%;
max-width:1000px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
cursor:pointer;
transition:0.3s;
}

.kalendarz img:hover{
transform:scale(1.02);
}

.error{
display:none;
margin-top:15px;
color:red;
font-weight:bold;
}

footer{
text-align:center;
padding:20px;
background:#003366;
color:white;
margin-top:40px;
}

.modal{
display:none;
position:fixed;
z-index:9999;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
overflow:hidden;
touch-action:none;
}

.modal-top{
position:fixed;
top:0;
left:0;
width:100%;
z-index:10001;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
padding:12px;
box-sizing:border-box;
background:rgba(0,0,0,0.6);
flex-wrap:wrap;
}

.modal-btn{
background:#e00000;
color:white;
border:none;
border-radius:20px;
padding:10px 18px;
font-weight:600;
cursor:pointer;
font-family:'Montserrat',sans-serif;
}

.modal-btn:hover{
opacity:0.9;
}

.close{
position:fixed;
top:10px;
right:20px;
font-size:42px;
color:white;
cursor:pointer;
font-weight:bold;
z-index:10002;
}

.close:hover{
color:#e00000;
}

.zoom-area{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
cursor:grab;
}

.zoom-area:active{
cursor:grabbing;
}

#zoomImage{
max-width:90%;
max-height:85%;
user-select:none;
-webkit-user-drag:none;
transform-origin:center center;
transition:transform 0.05s linear;
border-radius:12px;
}

.hint{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:14px;
background:rgba(0,0,0,0.6);
padding:10px 16px;
border-radius:20px;
z-index:10001;
text-align:center;
}

@media(max-width:600px){
.hero h1{
font-size:28px;
}

.modal-top{
padding-right:60px;
}

.modal-btn{
padding:8px 12px;
font-size:13px;
}

.hint{
font-size:12px;
width:85%;
}
}
</style>
</head>

<body>

<header>
<img src="logo.png" alt="AK ELEKTRO">
</header>

<section class="hero">
<h1>📅 Kalendarz AK ELEKTRO</h1>
<p>Dostęp zabezpieczony hasłem</p>

<a href="index.html" class="btn btn-primary">
⬅ Powrót do strony głównej
</a>
</section>

<div class="container">

<div class="card" id="loginBox">
<h2>Zaloguj do kalendarza</h2>

<input
type="password"
id="password"
placeholder="Wprowadź hasło">

<button class="btn btn-primary" onclick="login()">
Zaloguj
</button>

<div class="error" id="error">
❌ Nieprawidłowe hasło
</div>
</div>

<div class="card kalendarz" id="calendarBox">
<h2>📅 Kalendarz</h2>

<p>Kliknij kalendarz, aby otworzyć podgląd z zoomem</p>

<img
src="kalendarz.png"
alt="Kalendarz"
onclick="openModal()">

<br><br>

<button class="btn btn-primary" onclick="logout()">
Wyloguj
</button>
</div>

</div>

<div id="imageModal" class="modal">

<span class="close" onclick="closeModal()">&times;</span>

<div class="modal-top">
<button class="modal-btn" onclick="zoomIn()">+</button>
<button class="modal-btn" onclick="zoomOut()">-</button>
<button class="modal-btn" onclick="resetZoom()">Reset</button>
<button class="modal-btn" onclick="toggleFullscreen()">Pełny ekran</button>
</div>

<div class="zoom-area" id="zoomArea">
<img
id="zoomImage"
src="kalendarz.png"
alt="Powiększony kalendarz">
</div>

<div class="hint">
Kółko myszy = zoom | Przeciągnij obraz | Na telefonie użyj dwóch palców
</div>

</div>

<footer>
© 2026 AK ELEKTRO
</footer>

<script>
const PASSWORD="159";

let scale=1;
let posX=0;
let posY=0;

let isDragging=false;
let startX=0;
let startY=0;

let initialDistance=0;
let initialScale=1;

const minScale=1;
const maxScale=6;

function login(){
const enteredPassword=document.getElementById("password").value;

if(enteredPassword===PASSWORD){
document.getElementById("loginBox").style.display="none";
document.getElementById("calendarBox").style.display="block";
sessionStorage.setItem("calendarAccess","true");
}else{
document.getElementById("error").style.display="block";
}
}

function logout(){
sessionStorage.removeItem("calendarAccess");
location.reload();
}

function openModal(){
document.getElementById("imageModal").style.display="block";
resetZoom();
}

function closeModal(){
document.getElementById("imageModal").style.display="none";

if(document.fullscreenElement){
document.exitFullscreen();
}
}

function updateTransform(){
const img=document.getElementById("zoomImage");
img.style.transform=
"translate(" + posX + "px, " + posY + "px) scale(" + scale + ")";
}

function zoomIn(){
scale=Math.min(maxScale,scale+0.3);
updateTransform();
}

function zoomOut(){
scale=Math.max(minScale,scale-0.3);

if(scale===1){
posX=0;
posY=0;
}

updateTransform();
}

function resetZoom(){
scale=1;
posX=0;
posY=0;
updateTransform();
}

function toggleFullscreen(){
const modal=document.getElementById("imageModal");

if(!document.fullscreenElement){
modal.requestFullscreen();
}else{
document.exitFullscreen();
}
}

const zoomArea=document.getElementById("zoomArea");

zoomArea.addEventListener("wheel",function(e){
e.preventDefault();

const zoomSpeed=0.15;

if(e.deltaY<0){
scale=Math.min(maxScale,scale+zoomSpeed);
}else{
scale=Math.max(minScale,scale-zoomSpeed);
}

if(scale===1){
posX=0;
posY=0;
}

updateTransform();
},{passive:false});

zoomArea.addEventListener("mousedown",function(e){
isDragging=true;
startX=e.clientX-posX;
startY=e.clientY-posY;
});

window.addEventListener("mousemove",function(e){
if(!isDragging) return;

posX=e.clientX-startX;
posY=e.clientY-startY;

updateTransform();
});

window.addEventListener("mouseup",function(){
isDragging=false;
});

zoomArea.addEventListener("touchstart",function(e){
if(e.touches.length===1){
isDragging=true;
startX=e.touches[0].clientX-posX;
startY=e.touches[0].clientY-posY;
}

if(e.touches.length===2){
isDragging=false;
initialDistance=getDistance(e.touches[0],e.touches[1]);
initialScale=scale;
}
},{passive:false});

zoomArea.addEventListener("touchmove",function(e){
e.preventDefault();

if(e.touches.length===1 && isDragging){
posX=e.touches[0].clientX-startX;
posY=e.touches[0].clientY-startY;
updateTransform();
}

if(e.touches.length===2){
const currentDistance=getDistance(e.touches[0],e.touches[1]);
scale=initialScale*(currentDistance/initialDistance);

scale=Math.max(minScale,Math.min(maxScale,scale));

updateTransform();
}
},{passive:false});

zoomArea.addEventListener("touchend",function(){
isDragging=false;
});

function getDistance(touch1,touch2){
const dx=touch1.clientX-touch2.clientX;
const dy=touch1.clientY-touch2.clientY;
return Math.sqrt(dx*dx+dy*dy);
}

window.onload=function(){
if(sessionStorage.getItem("calendarAccess")==="true"){
document.getElementById("loginBox").style.display="none";
document.getElementById("calendarBox").style.display="block";
}
}
</script>

</body>
</html>
