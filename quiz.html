<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Elektryczny – AK ELEKTRO</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Montserrat',sans-serif;
    background:#f4f6f9;
    color:#222;
}

header{
    background:white;
    text-align:center;
    padding:20px;
}

header img{
    max-width:260px;
}

.hero{
    background:linear-gradient(135deg,#003366,#001a33);
    color:white;
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:36px;
    margin-bottom:10px;
}

.hero p{
    font-size:18px;
}

.back{
    display:inline-block;
    margin-top:15px;
    color:white;
    text-decoration:none;
    background:#e00000;
    padding:12px 25px;
    border-radius:30px;
    font-weight:600;
}

.container{
    max-width:1000px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:6px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

.option{
    background:white;
    padding:15px;
    margin:12px 0;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
    transition:0.3s;
}

.option:hover{
    background:#e00000;
    color:white;
}

.selected{
    background:#003366;
    color:white;
}

button{
    width:100%;
    padding:15px;
    background:#e00000;
    color:white;
    border:none;
    border-radius:30px;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    opacity:0.9;
}

.progress{
    font-weight:bold;
    margin-bottom:20px;
    color:#003366;
}

.ranking{
    margin-top:20px;
    background:#f4f6f9;
    padding:20px;
    border-radius:12px;
}

footer{
    text-align:center;
    padding:20px;
    background:#003366;
    color:white;
    margin-top:40px;
}

</style>

</head>

<body>

<header>
    <img src="logo.png" alt="AK ELEKTRO">
</header>

<section class="hero">
    <h1>⚡ Quiz Elektryczny</h1>
    <p>Sprawdź swoją wiedzę elektryczną</p>

    <a href="index.html" class="back">
        ⬅ Powrót do strony głównej
    </a>
</section>

<div class="container">

<div class="card" id="app">

<div id="start">

<input
type="text"
id="name"
placeholder="Twoje imię (do rankingu)">

<button onclick="startQuiz('client')">
🏠 Test dla klienta
</button>

<button onclick="startQuiz('pro')">
👷 Test dla elektryka
</button>

</div>

<div id="quiz" style="display:none;">

<div class="progress" id="progress"></div>

<h2 id="question"></h2>

<div id="options"></div>

<button onclick="next()">
Dalej
</button>

</div>

</div>

</div>

<footer>
© 2026 AK ELEKTRO
</footer>

<script>

// ===== PYTANIA DLA KLIENTA =====

const clientQuestions = [

["Gniazdko iskrzy. Co robisz?",["Wyłączam prąd i wzywam elektryka","Ignoruję","Używam dalej","Polewam wodą"],0],

["Często wyskakuje bezpiecznik. To oznacza:",["Problem w instalacji","Normalne","Brak prądu","Za mało napięcia"],0],

["Zapach spalenizny z instalacji:",["Wyłączam prąd","Ignoruję","Otwieram okno","Podłączam więcej"],0],

["Stara instalacja może być:",["Niebezpieczna","Najlepsza","Nowoczesna","Bez znaczenia"],0],

["Uszkodzony kabel:",["Wymieniam","Używam dalej","Ignoruję","Zalewam wodą"],0]

];

// ===== PYTANIA DLA ELEKTRYKA =====

const proQuestions = [

["Która jednostka jest jednostką natężenia prądu elektrycznego?",["Wolt","Amper","Om","Wat"],1],

["Jak nazywa się urządzenie do pomiaru napięcia?",["Amperomierz","Woltomierz","Omomierz","Miernik cęgowy"],1],

["Napięcie w gniazdku:",["110V","230V","400V","12V"],1],

["Wzór na moc:",["P=U×I","P=U/R","P=I/R","P=R×I"],0],

["Prawo Ohma:",["I=U/R","I=R/U","I=U×R","I=R²"],0]

];

let questions=[];
let index=0;
let score=0;
let selected=null;
let user="";

function startQuiz(type){

user=document.getElementById("name").value||"Anonim";

if(type==="client")
questions=clientQuestions;

if(type==="pro")
questions=proQuestions;

questions=[...questions]
.sort(()=>Math.random()-0.5)
.slice(0,10);

document.getElementById("start").style.display="none";

document.getElementById("quiz").style.display="block";

load();

}

function load(){

selected=null;

document.getElementById("progress").innerText=
`Pytanie ${index+1}/${questions.length}`;

document.getElementById("question").innerText=
questions[index][0];

let html="";

questions[index][1].forEach((opt,i)=>{

html+=`
<div class="option"
onclick="select(this,${i})">

${opt}

</div>`;

});

document.getElementById("options").innerHTML=html;

}

function select(el,i){

document
.querySelectorAll(".option")
.forEach(o=>o.classList.remove("selected"));

el.classList.add("selected");

selected=i;

}

function next(){

if(selected===null){

alert("Wybierz odpowiedź!");

return;

}

if(selected===questions[index][2])
score++;

index++;

if(index<questions.length)
load();

else
end();

}

function end(){

saveScore();

let ranking=
JSON.parse(localStorage.getItem("ranking"))||[];

document.getElementById("app").innerHTML=`

<h1>Wynik: ${score}/${questions.length}</h1>

<div class="ranking">

<h3>🏆 Ranking:</h3>

${ranking
.map(r=>`<div>${r.name} (${r.score})</div>`)
.join("")}

</div>

<button onclick="location.reload()">

Zagraj ponownie

</button>

<a href="index.html">

<button>

Strona główna

</button>

</a>

`;

}

function saveScore(){

let ranking=
JSON.parse(localStorage.getItem("ranking"))||[];

ranking.push({

name:user,
score:score

});

ranking.sort((a,b)=>b.score-a.score);

ranking=ranking.slice(0,5);

localStorage.setItem(
"ranking",
JSON.stringify(ranking)
);

}

</script>

</body>
</html>
